name: Assemble timeline
run-name: assemble-${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      request_id: {required: true, type: string}
      request_b64: {required: true, type: string}
      request_sha256: {required: true, type: string}
permissions: {contents: read, actions: read}
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Verify request
        env: {REQUEST_B64: '${{ inputs.request_b64 }}', REQUEST_SHA256: '${{ inputs.request_sha256 }}'}
        run: |
          printf '%s' "$REQUEST_B64" | base64 --decode > request.json
          test "$(sha256sum request.json | cut -d' ' -f1)" = "$REQUEST_SHA256"
      - run: npm run typecheck
      - run: node scripts/negative-tests.mjs
      - name: Assemble
        env: {EXPECTED_REQUEST_SHA256: '${{ inputs.request_sha256 }}', GITHUB_TOKEN: '${{ github.token }}'}
        run: node scripts/assemble-request.mjs request.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'video-assembly-${{ inputs.request_id }}-${{ github.run_id }}', path: 'out/', retention-days: 7, if-no-files-found: warn}
